<!-- Signal Wave sign-in email. Paste into Supabase → Authentication → Emails → Magic Link.
     Subject: Your Signal Wave code: {{ .Token }}
     Email apps ignore most CSS, so everything is inline and built from tables. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#05020f" style="background:#05020f;margin:0;padding:0;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;">
        <!-- neon strip -->
        <tr>
          <td height="4" style="font-size:0;line-height:0;background:#ff3ec8;background-image:linear-gradient(90deg,#00f0ff,#b84dff,#ff3ec8);">&nbsp;</td>
        </tr>
        <tr>
          <td bgcolor="#0b0618" style="background:#0b0618;border:1px solid #2b1a4d;border-top:0;padding:32px 28px 28px;font-family:'Chakra Petch',Rajdhani,'Arial Narrow',Arial,sans-serif;">
            <!-- wordmark -->
            <p style="margin:0 0 28px;font-size:20px;font-weight:700;letter-spacing:5px;color:#fcee0a;">
              SIGNAL<span style="color:#ff3ec8;">//</span>WAVE
            </p>
            <p style="margin:0 0 6px;font-size:11px;font-weight:700;letter-spacing:4px;color:#7a6a9a;">YOUR SIGN-IN CODE</p>
            <!-- the code -->
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
              <tr>
                <td bgcolor="#000000" style="background:#000000;border:1px solid #00f0ff;padding:18px 12px;text-align:center;">
                  <span style="font-family:'Share Tech Mono',Menlo,Consolas,'Courier New',monospace;font-size:38px;font-weight:700;letter-spacing:12px;color:#00f0ff;">{{ .Token }}</span>
                </td>
              </tr>
            </table>
            <p style="margin:22px 0 0;font-size:15px;line-height:1.55;color:#e6dcff;font-family:Arial,Helvetica,sans-serif;">
              Type this code into Signal Wave to sync your saved stations and genres across devices.
              It works once and expires in an hour.
            </p>
            <p style="margin:18px 0 0;font-size:13px;line-height:1.55;color:#9a8cb8;font-family:Arial,Helvetica,sans-serif;">
              On a computer you can also
              <a href="{{ .ConfirmationURL }}" style="color:#ff3ec8;text-decoration:underline;">sign in with this link</a>.
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 4px 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#6b5d88;">
            Didn't ask for this? Ignore it and nothing happens.<br>
            <span style="font-family:Menlo,Consolas,'Courier New',monospace;color:#39ff14;">&gt; LINK STANDING BY</span>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
